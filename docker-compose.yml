# Isolated stack: unique project name so containers, networks and volumes
# never collide with other Compose apps on the same VPS.
name: mahmoud-law-firm

services:
  app:
    build: .
    restart: unless-stopped
    # Bind loopback only — nginx on the host proxies the subdomain here.
    # Change LAW_FIRM_PORT in .env if 3017 is already taken.
    ports:
      - "127.0.0.1:${LAW_FIRM_PORT:-3017}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/law_office
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: law-office
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "src/jobs/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/law_office
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: law_office
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d law_office"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: other projects keep using their own Postgres.

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U postgres -Fc law_office > /backups/law_office_$$(date +%Y%m%d_%H%M).dump;
        find /backups -name "*.dump" -mtime +30 -delete;
        sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    # Console is not published on the host.

  minio-init:
    image: minio/mc
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      sh -c 'sleep 5;
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb -p local/law-office;
      exit 0'

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
