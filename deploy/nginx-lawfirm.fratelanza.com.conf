# Drop this file into the existing nginx sites-available (or conf.d).
# It only matches lawfirm.fratelanza.com — other server_name blocks are untouched.
#
#   sudo cp deploy/nginx-lawfirm.fratelanza.com.conf /etc/nginx/sites-available/lawfirm.fratelanza.com
#   sudo ln -s /etc/nginx/sites-available/lawfirm.fratelanza.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lawfirm.fratelanza.com

server {
    listen 80;
    listen [::]:80;
    server_name lawfirm.fratelanza.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
